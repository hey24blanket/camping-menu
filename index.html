<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>몬테비얀코 쳐묵 기행</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        :root {
            --bg-color: #FDFBF7;
            --line-color: #333333;
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            --accent-green: #E2F0CB;
            --accent-pink: #FFB7B2;
            --danger: #FF6B6B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e0e0e0;
            color: var(--line-color);
            font-family: var(--font-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            #app-container {
                width: 600px;
                height: 600px;
                border: 2px solid var(--line-color);
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            }
        }

        input,
        button {
            font-family: var(--font-main);
            border: 2px solid var(--line-color);
            background: var(--bg-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:active {
            background: var(--line-color);
            color: var(--bg-color);
        }

        /* 로그인 페이지 */
        #login-page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background-color: var(--bg-color);
            padding: 20px;
        }

        .login-box {
            width: 80%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hero-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: none;
            border-radius: 12px;
            background: transparent;
            display: block;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 -2px;
        }

        /* 캠핑장 주소와 이용 시간 */
        .camp-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin-top: -4px;
            color: #555;
            font-size: 13px;
            font-weight: 600;
        }

        .address-row {
            position: relative;
            width: 100%;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 52px;
            text-align: center;
        }

        #camp-address {
            line-height: 1.35;
            white-space: nowrap;
        }

        #copy-addr-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 6px;
            background-color: var(--accent-green);
            border: 1px solid var(--line-color);
            cursor: pointer;
        }

        .stay-info {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.35;
            text-align: center;
        }

        .stay-divider {
            color: #aaa;
            font-weight: 400;
        }

        .hint {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: -6px;
        }

        .login-box input {
            width: 100%;
        }

        .input-icon-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon-wrapper input {
            padding-right: 40px;
        }

        #toggle-pw-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        #toggle-pw-btn:active {
            background: transparent;
        }

        /* 메인 페이지 */
        #main-page {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
        }

        #top-bar {
            height: 10%;
            min-height: 50px;
            border-bottom: 2px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            position: relative;
            background: var(--bg-color);
        }

        #arena {
            height: 75%;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.55) 0%,
                    rgba(255,255,255,0.18) 45%,
                    rgba(0,0,0,0) 100%
                );
        }

        .menu-ball {
            position: absolute;
            border: 2px solid var(--line-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-align: center;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
            user-select: none;
            transition: opacity 0.25s, transform 0.2s;
            transform-origin: center;
            word-break: keep-all;
            font-size: 14px;
            padding: 6px;
            z-index: 10;
            overflow: hidden;
            line-height: 1.2;
            cursor: pointer;
        }

        .ball-comment-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 0.65em;
            color: var(--line-color);
            font-weight: 900;
            margin-bottom: 2px;
            line-height: 1;
        }

        .ball-comment-icon {
            width: 12px;
            height: 12px;
            display: block;
            flex: 0 0 auto;
        }

        .ball-user {
            font-size: 0.7em;
            color: #777;
            font-weight: normal;
            margin-bottom: 2px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ball-text {
            font-weight: bold;
            word-break: keep-all;
        }

        .menu-ball.dimmed {
            opacity: 0.16;
        }

        .menu-ball.interaction-disabled {
            pointer-events: none;
        }

        .menu-ball.highlight {
            box-shadow: 0 0 18px rgba(0,0,0,0.28);
            border-width: 3px;
            z-index: 120;
            opacity: 1 !important;
            transform: scale(1.08);
        }

        .delete-overlay {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--danger);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25em;
            font-weight: 900;
            cursor: pointer;
        }

        /* 댓글창 */
        .chat-window {
            position: absolute;
            z-index: 100;
            border: 2px solid var(--line-color);
            border-radius: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
            min-width: 0;
            min-height: 0;
        }

        .chat-window.attach-top-left {
            border-top-left-radius: 2px;
        }

        .chat-window.attach-top-right {
            border-top-right-radius: 2px;
        }

        .chat-window.attach-bottom-left {
            border-bottom-left-radius: 2px;
        }

        .chat-window.attach-bottom-right {
            border-bottom-right-radius: 2px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-color);
        }

        .chat-bubble {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 13px;
            color: #333;
            max-width: 85%;
            align-self: flex-start;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.05);
        }

        .chat-empty {
            margin: auto;
            padding: 12px;
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        .chat-input-row {
            display: flex;
            border-top: 2px solid var(--line-color);
            background: #fff;
            height: 40px;
        }

        .chat-input {
            flex: 1;
            border: none;
            padding: 0 10px;
            outline: none;
            font-size: 13px;
            border-radius: 0;
        }

        .chat-send-btn {
            border: none;
            background: var(--accent-green);
            font-weight: bold;
            padding: 0 12px;
            border-left: 2px solid var(--line-color);
            border-radius: 0;
            cursor: pointer;
        }

        #bottom-bar {
            height: 15%;
            min-height: 70px;
            border-top: 2px solid var(--line-color);
            padding: 10px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
        }

        #menu-input {
            flex: 2;
            height: 45px;
            min-width: 0;
        }

        #throw-btn {
            flex: 1;
            height: 45px;
            min-width: 0;
            background: var(--accent-green);
            white-space: nowrap;
        }

        #my-menu-btn {
            flex: 0 0 52px;
            height: 45px;
            min-width: 0;
            background: var(--accent-pink);
            white-space: nowrap;
            font-size: 22px;
            line-height: 1;
            padding: 0;
        }

        #my-menu-btn.active {
            background: var(--line-color);
            color: var(--bg-color);
        }

        #modal {
            display: none;
            position: absolute;
            top: 12%;
            left: 4%;
            width: 92%;
            height: 74%;
            background: var(--bg-color);
            border: 2px solid var(--line-color);
            border-radius: 12px;
            z-index: 200;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 15px;
            border-bottom: 2px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: #fff;
            flex: 0 0 auto;
        }

        .modal-content {
            padding: 12px;
            background: var(--bg-color);
            flex: 1;
            overflow: hidden;
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .list-item {
            min-height: 44px;
            padding: 10px 8px;
            border: 1px solid #d8d8d8;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 14px;
            grid-column: 1 / -1;
            align-self: center;
            justify-self: center;
        }

        #toast {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateY(12px);
            opacity: 0;
            pointer-events: none;
            z-index: 400;
            min-width: 180px;
            max-width: 80%;
            padding: 14px 18px;
            border: 2px solid var(--line-color);
            background: #fff;
            border-radius: 14px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.18);
            text-align: center;
            font-weight: 700;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) translateY(0);
        }
    </style>
</head>

<body>
<div id="app-container">

    <div id="login-page">
        <div class="login-box">

            <img
                class="hero-image"
                src="https://raw.githubusercontent.com/hey24blanket/camping-menu/refs/heads/main/hero_00000.png"
                alt="캠핑 이미지"
            />

            <h2 class="login-title">몬테비얀코 쳐묵 기행</h2>

            <div class="camp-info">
                <div class="address-row">
                    <span id="camp-address">경기 포천시 이동면 늠바위길 181</span>
                    <button type="button" id="copy-addr-btn">복사</button>
                </div>

                <div class="stay-info" aria-label="입실 및 퇴실 시간">
                    <span>입실 1시</span>
                    <span class="stay-divider" aria-hidden="true">·</span>
                    <span>퇴실 12시</span>
                </div>
            </div>

            <input
                type="text"
                id="userid"
                placeholder="아이디 (띄어쓰기 없는 한글)"
            />

            <p class="hint">DB 확인 후 없으면 자동 가입됩니다.</p>

            <div class="input-icon-wrapper">
                <input
                    type="password"
                    id="userpw"
                    placeholder="비밀번호 (숫자 3자리)"
                    inputmode="numeric"
                    maxlength="3"
                />

                <button
                    type="button"
                    id="toggle-pw-btn"
                    aria-label="비밀번호 보기"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#999"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button id="login-btn">들어가기</button>
        </div>
    </div>

    <div id="main-page">
        <div id="top-bar">
            <div>
                메뉴: <span id="menu-count">0</span>
            </div>

            <button id="modal-btn">리스트</button>
        </div>

        <div id="arena"></div>

        <div id="bottom-bar">
            <input
                type="text"
                id="menu-input"
                placeholder="뭘 드실까요?"
            />

            <button id="throw-btn">쳐묵</button>
            <button id="my-menu-btn">-</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <span>리스트</span>
            <span
                id="modal-close-btn"
                style="cursor:pointer; padding:0 10px;"
            >
                X
            </span>
        </div>

        <div class="modal-content" id="menu-list"></div>
    </div>

    <div id="toast"></div>
</div>

<script type="module">
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        get,
        set,
        child,
        push,
        remove,
        onChildAdded,
        onChildRemoved,
        onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC6n0Pw2GPg4MO6oUaWrBd7PT-GM-ufAw8",
        authDomain: "monte-bianco-773a6.firebaseapp.com",
        projectId: "monte-bianco-773a6",
        storageBucket: "monte-bianco-773a6.firebasestorage.app",
        messagingSenderId: "429437163337",
        appId: "1:429437163337:web:f11e1a770ee03cb5336c98",
        measurementId: "G-P4EP75DYB8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let menus = [];
    let isPaused = false;
    let activeSuggestionBallId = null;
    let activeChatWindow = null;
    let toastTimer = null;

    const pastelColors = [
        '#FFB7B2',
        '#FFD8BE',
        '#FFF1B6',
        '#E2F0CB',
        '#CDECCF',
        '#B5EAD7',
        '#C7F0FF',
        '#C7CEEA',
        '#D9C2F0',
        '#F1C0E8',
        '#FDE2E4',
        '#D0F4DE'
    ];

    const NORMAL_SPEED = 0.55;
    const LAUNCH_SPEED = 10.5;
    const LAUNCH_DURATION = 2000;
    const COLLISION_PUSH = 0.00035;
    const OVERLAP_PADDING = 3;

    const {
        Engine,
        Bodies,
        Composite,
        Body,
        Vector
    } = Matter;

    let engine;
    let arenaWidth;
    let arenaHeight;
    let boundaries = [];

    const arenaEl = document.getElementById('arena');
    const loginBtn = document.getElementById('login-btn');
    const throwBtn = document.getElementById('throw-btn');
    const myMenuBtn = document.getElementById('my-menu-btn');
    const modalBtn = document.getElementById('modal-btn');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const menuInput = document.getElementById('menu-input');
    const pwInput = document.getElementById('userpw');
    const togglePwBtn = document.getElementById('toggle-pw-btn');
    const copyAddrBtn = document.getElementById('copy-addr-btn');

    if (copyAddrBtn) {
        copyAddrBtn.addEventListener('click', () => {
            const address = "경기 포천시 이동면 늠바위길 181";

            navigator.clipboard.writeText(address)
                .then(() => {
                    showToast("주소가 복사되었습니다.");
                })
                .catch(() => {
                    showToast("복사 실패! 직접 선택해서 복사해주세요.");
                });
        });
    }

    function showToast(message, duration = 1600) {
        const toast = document.getElementById('toast');

        clearTimeout(toastTimer);

        toast.textContent = message;
        toast.classList.add('show');

        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function randomDirection() {
        const angle = Math.random() * Math.PI * 2;

        return {
            x: Math.cos(angle),
            y: Math.sin(angle)
        };
    }

    function isFiniteVector(vector) {
        return Number.isFinite(vector.x) && Number.isFinite(vector.y);
    }

    function initPhysics() {
        engine = Engine.create();

        engine.world.gravity.y = 0;
        engine.world.gravity.x = 0;

        arenaWidth = arenaEl.clientWidth;
        arenaHeight = arenaEl.clientHeight;

        createBoundaries();

        function renderLoop() {
            if (!engine) {
                return;
            }

            if (!isPaused && !activeSuggestionBallId) {
                Engine.update(engine, 1000 / 60);
                resolveOverlaps();
                regulateAllBodies();
            }

            menus.forEach((menu) => {
                const element = document.getElementById(menu.id);

                if (element && menu.body) {
                    element.style.left =
                        `${menu.body.position.x - menu.radius}px`;

                    element.style.top =
                        `${menu.body.position.y - menu.radius}px`;
                }
            });

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    }

    function createBoundaries() {
        if (engine && boundaries.length) {
            Composite.remove(engine.world, boundaries);
        }

        const wallOptions = {
            isStatic: true,
            restitution: 1,
            friction: 0,
            frictionStatic: 0,
            slop: 0
        };

        boundaries = [
            Bodies.rectangle(
                arenaWidth / 2,
                -25,
                arenaWidth,
                50,
                wallOptions
            ),

            Bodies.rectangle(
                arenaWidth / 2,
                arenaHeight + 25,
                arenaWidth,
                50,
                wallOptions
            ),

            Bodies.rectangle(
                -25,
                arenaHeight / 2,
                50,
                arenaHeight,
                wallOptions
            ),

            Bodies.rectangle(
                arenaWidth + 25,
                arenaHeight / 2,
                50,
                arenaHeight,
                wallOptions
            )
        ];

        Composite.add(engine.world, boundaries);
    }

    function regulateAllBodies() {
        const now = Date.now();

        menus.forEach((menu) => {
            const body = menu.body;

            if (!body) {
                return;
            }

            const velocity = body.velocity;
            const speed = Vector.magnitude(velocity);

            const direction =
                speed < 0.001 || !isFiniteVector(velocity)
                    ? randomDirection()
                    : Vector.normalise(velocity);

            let desiredSpeed = NORMAL_SPEED;

            if (menu.launchStart) {
                const elapsed = now - menu.launchStart;

                if (elapsed < LAUNCH_DURATION) {
                    desiredSpeed =
                        LAUNCH_SPEED +
                        (NORMAL_SPEED - LAUNCH_SPEED) *
                        (elapsed / LAUNCH_DURATION);
                } else {
                    desiredSpeed = NORMAL_SPEED;
                    menu.launchStart = null;
                }
            }

            const adjustment = menu.launchStart ? 0.12 : 0.25;
            const adjustedSpeed =
                speed + (desiredSpeed - speed) * adjustment;

            Body.setVelocity(body, {
                x: direction.x * adjustedSpeed,
                y: direction.y * adjustedSpeed
            });
        });
    }

    function resolveOverlaps() {
        for (let i = 0; i < menus.length; i++) {
            for (let j = i + 1; j < menus.length; j++) {
                const first = menus[i];
                const second = menus[j];

                if (!first.body || !second.body) {
                    continue;
                }

                const dx =
                    second.body.position.x -
                    first.body.position.x;

                const dy =
                    second.body.position.y -
                    first.body.position.y;

                let distance = Math.sqrt(dx * dx + dy * dy);

                const minimumDistance =
                    first.radius +
                    second.radius +
                    OVERLAP_PADDING;

                if (distance < minimumDistance) {
                    const safeDistance =
                        distance === 0 ? 0.01 : distance;

                    const overlap =
                        (minimumDistance - safeDistance) / 2;

                    const normalX = dx / safeDistance;
                    const normalY = dy / safeDistance;

                    Body.setPosition(first.body, {
                        x: clamp(
                            first.body.position.x - normalX * overlap,
                            first.radius,
                            arenaWidth - first.radius
                        ),

                        y: clamp(
                            first.body.position.y - normalY * overlap,
                            first.radius,
                            arenaHeight - first.radius
                        )
                    });

                    Body.setPosition(second.body, {
                        x: clamp(
                            second.body.position.x + normalX * overlap,
                            second.radius,
                            arenaWidth - second.radius
                        ),

                        y: clamp(
                            second.body.position.y + normalY * overlap,
                            second.radius,
                            arenaHeight - second.radius
                        )
                    });

                    Body.applyForce(
                        first.body,
                        first.body.position,
                        {
                            x: -normalX * COLLISION_PUSH,
                            y: -normalY * COLLISION_PUSH
                        }
                    );

                    Body.applyForce(
                        second.body,
                        second.body.position,
                        {
                            x: normalX * COLLISION_PUSH,
                            y: normalY * COLLISION_PUSH
                        }
                    );
                }
            }
        }
    }

    function recalculateSizes() {
        if (menus.length === 0) {
            return;
        }

        const totalBaseArea = menus.reduce((total, menu) => {
            return total + Math.PI * Math.pow(menu.baseRadius, 2);
        }, 0);

        const availableArea =
            arenaWidth *
            arenaHeight *
            0.34;

        const scaleFactor = Math.sqrt(
            Math.min(1, availableArea / totalBaseArea)
        );

        menus.forEach((menu) => {
            const targetRadius = Math.max(
                22,
                menu.baseRadius * scaleFactor
            );

            const ratio = targetRadius / menu.radius;

            Body.scale(menu.body, ratio, ratio);

            menu.radius = targetRadius;

            const element = document.getElementById(menu.id);

            if (element) {
                element.style.width = `${menu.radius * 2}px`;
                element.style.height = `${menu.radius * 2}px`;
                element.style.fontSize =
                    `${Math.max(10, 14 * scaleFactor)}px`;
            }
        });
    }

    function findSpawnPosition(radius) {
        for (let i = 0; i < 40; i++) {
            const x = clamp(
                arenaWidth / 2 +
                (Math.random() - 0.5) *
                (18 + i * 6),

                radius + 6,
                arenaWidth - radius - 6
            );

            const y = clamp(
                arenaHeight - radius - 14 - i * 4,
                radius + 6,
                arenaHeight - radius - 6
            );

            const overlaps = menus.some((menu) => {
                return Math.hypot(
                    menu.body.position.x - x,
                    menu.body.position.y - y
                ) < menu.radius + radius + 8;
            });

            if (!overlaps) {
                return { x, y };
            }
        }

        return {
            x: clamp(
                arenaWidth / 2,
                radius + 6,
                arenaWidth - radius - 6
            ),

            y: arenaHeight - radius - 14
        };
    }

    function launchBall(menu) {
        const angle =
            (-90 + (Math.random() * 24 - 12)) *
            Math.PI /
            180;

        Body.setVelocity(menu.body, {
            x: Math.cos(angle) * LAUNCH_SPEED,
            y: Math.sin(angle) * LAUNCH_SPEED
        });

        menu.launchStart = Date.now();
    }

    function escapeHTML(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function getBallInnerHTML(menu) {
        const commentBadge =
            menu.commentCount > 0
                ? `
                    <div
                        class="ball-comment-count"
                        aria-label="댓글 ${menu.commentCount}개"
                    >
                        <svg
                            class="ball-comment-icon"

                        </svg>

                        <span>${menu.commentCount}</span>
                    </div>
                `
                : '';

        return `
            ${commentBadge}
            <div class="ball-user">
                ${escapeHTML(menu.user)}
            </div>
            <div class="ball-text">
                ${escapeHTML(menu.text)}
            </div>
        `;
    }

    function normalizeComments(rawComments) {
        if (
            !rawComments ||
            typeof rawComments !== 'object'
        ) {
            return [];
        }

        return Object.entries(rawComments)
            .map(([id, value]) => {
                if (
                    typeof value === 'string' ||
                    typeof value === 'number'
                ) {
                    return {
                        id,
                        text: String(value),
                        user: '',
                        timestamp: 0
                    };
                }

                if (
                    value &&
                    typeof value === 'object'
                ) {
                    const text =
                        value.text ??
                        value.comment ??
                        value.message ??
                        '';

                    return {
                        id,
                        text: String(text),
                        user: String(value.user ?? ''),
                        timestamp:
                            Number(value.timestamp) || 0
                    };
                }

                return null;
            })
            .filter((comment) => {
                return (
                    comment &&
                    comment.text.trim() !== ''
                );
            });
    }

    function renderChatComments(menu) {

            empty.className = 'chat-empty';

        menu.comments.forEach((comment) => {

            listElement.appendChild(bubble);

    }

    async function handleLogin() {
        const idValue =
            document
                .getElementById('userid')
                .value
                .trim();

        const passwordValue =
            pwInput.value.trim();

        if (!/^[가-힣]+$/.test(idValue)) {
            showToast("아이디는 한글만 가능합니다.");
            return;
        }

        if (!/^\d{3}$/.test(passwordValue)) {
            showToast("비밀번호는 숫자 3자리입니다.");
            return;
        }

        try {
            const snapshot = await get(
                child(
                    ref(db),
                    `users/${idValue}`
                )
            );

            let toastMessage = '';

            if (snapshot.exists()) {
                if (
                    snapshot.val().password !==
                    passwordValue
                ) {
                    showToast("비밀번호가 틀렸습니다.");
                    return;
                }

                toastMessage = "다시 로그인 함.";
            } else {
                await set(
                    ref(db, `users/${idValue}`),
                    {
                        password: passwordValue
                    }
                );

                toastMessage = "새로운 사람.";
            }

            currentUser = idValue;

            document
                .getElementById('login-page')
                .style
                .display = 'none';

            document
                .getElementById('main-page')
                .style
                .display = 'flex';

            if (!engine) {
                initPhysics();
                initFirebaseListeners();
            }

            showToast(toastMessage, 1800);
        } catch (error) {
            showToast("DB 연결 오류가 발생했습니다.");
        }
    }

                timestamp: Date.now()
            }
        );

        menuInput.value = '';
    }

    function initFirebaseListeners() {
        onChildAdded(
            ref(db, 'menus'),
            (data) => {
                const value = data.val();
                const ballId = data.key;
                const radius =
                    45 + Math.random() * 8;

                const newMenu = {
                    id: ballId,
                    user: value.user,
                    text: value.text,
                    radius,
                    baseRadius: radius,
                    launchStart: null,
                    commentCount: 0,
                    comments: [],
                    commentsLoaded: false
                };

                const ballElement =
                    document.createElement('div');

                ballElement.id = ballId;
                ballElement.className = 'menu-ball';
                ballElement.innerHTML =
                    getBallInnerHTML(newMenu);

                ballElement.style.width =
                    `${radius * 2}px`;

                ballElement.style.height =
                    `${radius * 2}px`;

                ballElement.style.backgroundColor =
                    pastelColors[
                        menus.length %
                        pastelColors.length
                    ];

                ballElement.addEventListener(
                    'click',
                    (event) => {
                        event.stopPropagation();

                        handleBallClick(
                            ballId,
                            value.text,
                            value.user
                        );
                    }
                );

                arenaEl.appendChild(ballElement);

                const spawn =
                    findSpawnPosition(radius);

                const body = Bodies.circle(
                    spawn.x,
                    spawn.y,
                    radius,
                    {
                        restitution: 1,
                        friction: 0,
                        frictionStatic: 0,
                        frictionAir: 0,
                        density: 0.02,
                        slop: 0
                    }
                );

                Composite.add(engine.world, body);

                newMenu.body = body;
                menus.push(newMenu);

                recalculateSizes();
                resolveOverlaps();
                launchBall(newMenu);
                updateUI();

                if (activeSuggestionBallId) {
                    applyChatFocus(
                        activeSuggestionBallId
                    );
                }

                const commentsReference =
                    ref(
                        db,
                        `menus/${ballId}/comments`
                    );

                onValue(
                    commentsReference,
                    (snapshot) => {
                        const menu = menus.find(
                            (item) =>
                                item.id === ballId
                        );

                        if (!menu) {
                            return;
                        }

                        menu.comments =
                            normalizeComments(
                                snapshot.val()
                            );

                        menu.commentCount =
                            menu.comments.length;

                        menu.commentsLoaded = true;

                        const element =
                            document.getElementById(
                                ballId
                            );

                        if (
                            element &&
                            !element.querySelector(
                                '.delete-overlay'
                            )
                        ) {
                            element.innerHTML =
                                getBallInnerHTML(menu);
                        }

                        renderChatComments(menu);
                    }
                );
            }
        );

        onChildRemoved(
            ref(db, 'menus'),
            (data) => {
                const index =
                    menus.findIndex(
                        (menu) =>
                            menu.id === data.key
                    );

                if (index > -1) {
                    if (
                        activeSuggestionBallId ===
                        data.key
                    ) {
                        closeSuggestionMode();
                    }

                    Composite.remove(
                        engine.world,
                        menus[index].body
                    );

                    document
                        .getElementById(data.key)
                        ?.remove();

                    menus.splice(index, 1);

                    recalculateSizes();
                    updateUI();
                }
            }
        );
    }

    function handleBallClick(

        text,
        user

            const ballElement =
                document.getElementById(ballId);

            if (

                ballElement.querySelector(

            menus.forEach((menu) => {
                const otherElement =

                if (

                        '.delete-overlay'
                    )

            ballElement.innerHTML = `

                    event.stopPropagation();

                    remove(
                        ref(
                            db,
                            `menus/${ballId}`

            return;
        }

        if (
            activeSuggestionBallId === ballId
        ) {

        if (activeSuggestionBallId) {
            closeSuggestionMode();
        }

        openSuggestionMode(ballId);

    function getBestChatPlacement(ball) {
        const margin = 4;

        const visualRadius =
            ball.radius * 1.08;

        const diagonal =
            visualRadius / Math.SQRT2;

        const ballX =
            ball.body.position.x;

        const ballY =
            ball.body.position.y;

        const preferredWidth = clamp(
            arenaWidth * 0.58,
            220,
            340
        );

        const preferredHeight = clamp(
            arenaHeight * 0.58,
            180,
            300
        );

        const minimumWidth = Math.min(
            150,
            arenaWidth - margin * 2
        );

        const minimumHeight = Math.min(
            105,
            arenaHeight - margin * 2
        );

        const candidates = [
            {
                horizontal: 'right',
                vertical: 'down',
                attachClass: 'attach-top-left',
                anchorX: ballX + diagonal,
                anchorY: ballY + diagonal
            },

            {
                horizontal: 'left',
                vertical: 'down',
                attachClass: 'attach-top-right',
                anchorX: ballX - diagonal,
                anchorY: ballY + diagonal
            },

            {
                horizontal: 'right',
                vertical: 'up',
                attachClass: 'attach-bottom-left',
                anchorX: ballX + diagonal,
                anchorY: ballY - diagonal
            },

            {
                horizontal: 'left',
                vertical: 'up',
                attachClass: 'attach-bottom-right',
                anchorX: ballX - diagonal,
                anchorY: ballY - diagonal
            }
        ].map((candidate) => {
            const availableWidth =
                candidate.horizontal === 'right'
                    ? arenaWidth -
                      margin -
                      candidate.anchorX
                    : candidate.anchorX -
                      margin;

            const availableHeight =
                candidate.vertical === 'down'
                    ? arenaHeight -
                      margin -
                      candidate.anchorY
                    : candidate.anchorY -
                      margin;

            const width = Math.max(
                0,
                Math.min(
                    preferredWidth,
                    availableWidth
                )
            );

            const height = Math.max(
                0,
                Math.min(
                    preferredHeight,
                    availableHeight
                )
            );

            const meetsMinimum =
                width >= minimumWidth &&
                height >= minimumHeight;

            return {
                ...candidate,
                availableWidth,
                availableHeight,
                width,
                height,
                meetsMinimum,
                score: width * height
            };
        });

        const usableCandidates =
            candidates.filter(
                (candidate) =>
                    candidate.meetsMinimum
            );

        const candidatePool =
            usableCandidates.length
                ? usableCandidates
                : candidates;

        return candidatePool.sort(
            (first, second) =>
                second.score -
                first.score
        )[0];
    }

    function positionChatWindow(
        ballId,
        chatWindow
    ) {
        const ball = menus.find(
            (menu) =>
                menu.id === ballId
        );

        if (!ball || !chatWindow) {
            return;
        }

        const placement =
            getBestChatPlacement(ball);

        const margin = 4;

        const width = Math.max(
            1,
            Math.min(
                placement.width,
                arenaWidth - margin * 2
            )
        );

        const height = Math.max(
            1,
            Math.min(
                placement.height,
                arenaHeight - margin * 2
            )
        );

        let left =
            placement.horizontal === 'right'
                ? placement.anchorX
                : placement.anchorX - width;

        let top =
            placement.vertical === 'down'
                ? placement.anchorY
                : placement.anchorY - height;

        left = clamp(
            left,
            margin,
            arenaWidth - width - margin
        );

        top = clamp(
            top,
            margin,
            arenaHeight - height - margin
        );

        chatWindow.classList.remove(
            'attach-top-left',
            'attach-top-right',
            'attach-bottom-left',
            'attach-bottom-right'
        );

        chatWindow.classList.add(
            placement.attachClass
        );

        chatWindow.style.width =
            `${width}px`;

        chatWindow.style.height =
            `${height}px`;

        chatWindow.style.left =
            `${left}px`;

        chatWindow.style.top =
            `${top}px`;
    }

    function openSuggestionMode(ballId) {
        const ball = menus.find(
            (menu) =>
                menu.id === ballId
        );

        if (!ball) {
            return;
        }

        activeSuggestionBallId = ballId;

        applyChatFocus(ballId);

        const chatWindow =
            document.createElement('div');

        chatWindow.className =
            'chat-window';

        chatWindow.innerHTML = `
            <div
                class="chat-list"
                id="chat-list-${ballId}"
            ></div>

            <div class="chat-input-row">
                <input
                    type="text"
                    class="chat-input"
                    placeholder="댓글 입력..."
                />

                <button
                    type="button"
                    class="chat-send-btn"
                >
                    전송
                </button>
            </div>
        `;

        arenaEl.appendChild(chatWindow);

        activeChatWindow = chatWindow;

        positionChatWindow(
            ballId,
            chatWindow
        );

        renderChatComments(ball);

        const input =
            chatWindow.querySelector(
                '.chat-input'
            );

        const sendButton =
            chatWindow.querySelector(
                '.chat-send-btn'
            );

        const sendComment = async () => {
            const text =
                input.value.trim();

            if (!text) {
                return;
            }

            sendButton.disabled = true;

            try {
                await push(
                    ref(
                        db,
                        `menus/${ballId}/comments`
                    ),
                    text
                );

                input.value = '';
                input.focus();
            } catch (error) {
                showToast(
                    '댓글 전송에 실패했습니다.'
                );
            } finally {
                sendButton.disabled = false;
            }
        };

        sendButton.addEventListener(
            'click',
            sendComment
        );

        input.addEventListener(
            'keydown',
            (event) => {
                if (
                    event.key === 'Enter' &&
                    !event.isComposing
                ) {
                    event.preventDefault();
                    sendComment();
                }
            }
        );
    }

    function closeSuggestionMode() {
        if (activeChatWindow) {
            activeChatWindow.remove();
        }

        activeChatWindow = null;
        activeSuggestionBallId = null;

        if (!isPaused) {
            clearBallFocusStyles();
        }
    }

    function updateListLayout() {
        const listContainer =
            document.getElementById(
                'menu-list'
            );

        if (
            !listContainer ||
            menus.length === 0
        ) {
            return;
        }

        const rows = Math.max(
            1,
            Math.floor(
                (
                    listContainer.clientHeight ||
                    300
                ) / 52
            )
        );

        const columns = Math.max(
            1,
            Math.ceil(
                menus.length / rows
            )
        );

        listContainer.style.gridTemplateRows =
            `repeat(${rows}, minmax(44px, 1fr))`;

        listContainer.style.gridTemplateColumns =
            `repeat(${columns}, minmax(120px, 1fr))`;
    }

    function updateUI() {
        document
            .getElementById('menu-count')
            .innerText = menus.length;

        const listContainer =
            document.getElementById(
                'menu-list'
            );

        listContainer.innerHTML =
            menus.length === 0
                ? `
                    <div class="empty-msg">
                        아직 쳐묵할 메뉴가 없습니다.
                    </div>
                `
                : '';

        menus.forEach((menu) => {
            const item =
                document.createElement('div');

            item.className = 'list-item';
            item.innerText = menu.text;

            listContainer.appendChild(item);
        });

        requestAnimationFrame(
            updateListLayout
        );
    }

    function toggleModal() {
        const modal =
            document.getElementById('modal');

        modal.style.display =
            modal.style.display === 'flex'
                ? 'none'
                : 'flex';

        if (modal.style.display === 'flex') {
            requestAnimationFrame(
                updateListLayout
            );
        }
    }
</script>
</body>
</html>
