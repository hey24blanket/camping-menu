<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>October 3 · 몬테비얀코 쳐묵 기행</title>
    <meta name="theme-color" content="#234d3e">
    <meta name="description" content="10월 3일, 함께 고르는 캠핑 메뉴. 메뉴를 쏘고 좋아요를 누르며 사진과 이야기를 나누세요.">

    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        :root {
            --bg-color: #FDFBF7;
            --line-color: #333333;
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            --accent-green: #E2F0CB;
            --accent-pink: #FFB7B2;
            --danger: #FF6B6B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #e0e0e0;
            color: var(--line-color);
            font-family: var(--font-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            #app-container {
                width: 600px;
                height: 600px;
                border: 2px solid var(--line-color);
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            }
        }

        input, button {
            font-family: var(--font-main);
            border: 2px solid var(--line-color);
            background: var(--bg-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:active {
            background: var(--line-color);
            color: var(--bg-color);
        }

        /* 로그인 페이지 */
        #login-page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background-color: var(--bg-color);
            padding: 20px;
        }

        .login-box {
            width: 80%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hero-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: none;
            border-radius: 12px;
            background: transparent;
            display: block;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 -2px;
        }

        /* 캠핑장 주소와 이용 시간 */
        .camp-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin-top: -4px;
            color: #555;
            font-size: 13px;
            font-weight: 600;
        }

        .address-row {
            position: relative;
            width: 100%;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 52px;
            text-align: center;
        }

        #camp-address {
            line-height: 1.35;
            white-space: nowrap;
        }

        #copy-addr-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 6px;
            background-color: var(--accent-green);
            border: 1px solid var(--line-color);
            cursor: pointer;
        }

        .stay-info {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.35;
            text-align: center;
        }

        .stay-divider {
            color: #aaa;
            font-weight: 400;
        }

        .hint {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: -6px;
        }

        .login-box input {
            width: 100%;
        }

        .input-icon-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon-wrapper input {
            padding-right: 40px;
        }

        #toggle-pw-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        #toggle-pw-btn:active {
            background: transparent;
        }

        /* 메인 페이지 */
        #main-page {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
        }

        /* 상단 */
        #top-bar {
            height: 10%;
            min-height: 50px;
            border-bottom: 2px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            position: relative;
            background: var(--bg-color);
        }

        /* 아레나 */
        #arena {
            height: 75%;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 45%, rgba(0,0,0,0) 100%);
        }

        .menu-ball {
            position: absolute;
            border: 2px solid var(--line-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-align: center;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.12);
            user-select: none;
            transition: opacity 0.25s, transform 0.2s;
            transform-origin: center;
            word-break: keep-all;
            font-size: 14px;
            padding: 6px;
            z-index: 10;
            overflow: hidden;
            line-height: 1.2;
            cursor: pointer;
        }

        /* 메뉴 공 안의 댓글 카운트 */
        .ball-comment-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 0.65em;
            color: var(--line-color);
            font-weight: 900;
            margin-bottom: 2px;
            line-height: 1;
        }

        .ball-comment-icon {
            width: 12px;
            height: 12px;
            display: block;
            flex: 0 0 auto;
        }

        .ball-user {
            font-size: 0.7em;
            color: #777;
            font-weight: normal;
            margin-bottom: 2px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ball-text {
            font-weight: bold;
            word-break: keep-all;
        }

        .menu-ball.dimmed {
            opacity: 0.16;
        }

        /* 삭제 모드에서 다른 사람의 공만 클릭되지 않게 합니다. */
        .menu-ball.interaction-disabled {
            pointer-events: none;
        }

        /* 댓글창을 연 공 / 삭제 모드의 내 공 강조 */
        .menu-ball.highlight {
            box-shadow: 0 0 18px rgba(0,0,0,0.28);
            border-width: 3px;
            z-index: 120;
            opacity: 1 !important;
            transform: scale(1.08);
        }

        .delete-overlay {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--danger);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25em;
            font-weight: 900;
            cursor: pointer;
        }

        /* 💬 스마트 채팅창 스타일 (댓글 모드) */
        .chat-window {
            position: absolute;
            z-index: 100;
            border: 2px solid var(--line-color);
            border-radius: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
            min-width: 0;
            min-height: 0;
        }

        /* 선택한 공과 맞닿는 모서리는 덜 둥글게 하여 연결이 분명하게 보이게 합니다. */
        .chat-window.attach-top-left { border-top-left-radius: 2px; }
        .chat-window.attach-top-right { border-top-right-radius: 2px; }
        .chat-window.attach-bottom-left { border-bottom-left-radius: 2px; }
        .chat-window.attach-bottom-right { border-bottom-right-radius: 2px; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-color);
        }

        .chat-bubble {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 13px;
            color: #333;
            max-width: 85%;
            align-self: flex-start;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.05);
        }

        .chat-empty {
            margin: auto;
            padding: 12px;
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        .chat-input-row {
            display: flex;
            flex: 0 0 40px;
            width: 100%;
            min-width: 0;
            border-top: 2px solid var(--line-color);
            background: #fff;
            height: 40px;
            overflow: hidden;
        }

        .chat-input {
            flex: 1 1 auto;
            min-width: 0;
            width: 0;
            border: none;
            padding: 0 10px;
            outline: none;
            font-size: 13px;
            border-radius: 0; /* 테두리 중복 방지 */
        }

        .chat-send-btn {
            flex: 0 0 58px;
            width: 58px;
            min-width: 58px;
            max-width: 58px;
            height: 100%;
            border: none;
            background: var(--accent-green);
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
            padding: 0;
            border-left: 2px solid var(--line-color);
            border-radius: 0;
            cursor: pointer;
            white-space: nowrap;
            word-break: keep-all;
            writing-mode: horizontal-tb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 하단 바 */
        #bottom-bar {
            height: 15%;
            min-height: 70px;
            border-top: 2px solid var(--line-color);
            padding: 10px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
        }

        #menu-input {
            flex: 2;
            height: 45px;
            min-width: 0;
        }

        #throw-btn {
            flex: 1;
            height: 45px;
            min-width: 0;
            background: var(--accent-green);
            white-space: nowrap;
        }

        #my-menu-btn {
            flex: 0 0 52px;
            height: 45px;
            min-width: 0;
            background: var(--accent-pink);
            white-space: nowrap;
            font-size: 22px;
            line-height: 1;
            padding: 0;
        }

        #my-menu-btn.active {
            background: var(--line-color);
            color: var(--bg-color);
        }

        /* 모달 및 토스트 */
        #modal { display: none; position: absolute; top: 12%; left: 4%; width: 92%; height: 74%; background: var(--bg-color); border: 2px solid var(--line-color); border-radius: 12px; z-index: 200; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px; border-bottom: 2px solid var(--line-color); display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #fff; flex: 0 0 auto; }
        .modal-content { padding: 12px; background: var(--bg-color); flex: 1; overflow: hidden; display: grid; gap: 8px; align-content: start; }
        .list-item { min-height: 44px; padding: 10px 8px; border: 1px solid #d8d8d8; border-radius: 10px; text-align: center; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; background: #fff; }
        .empty-msg { text-align: center; padding: 30px; color: #888; font-size: 14px; grid-column: 1 / -1; align-self: center; justify-self: center; }
        #toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) translateY(12px); opacity: 0; pointer-events: none; z-index: 400; min-width: 180px; max-width: 80%; padding: 14px 18px; border: 2px solid var(--line-color); background: #fff; border-radius: 14px; box-shadow: 4px 4px 0 rgba(0,0,0,0.18); text-align: center; font-weight: 700; transition: opacity 0.4s ease, transform 0.4s ease; }
        #toast.show { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
/* October picnic refresh */
:root { --bg-color:#fcfaf4; --line-color:#263f35; --accent-green:#d9ed93; --accent-pink:#f4c5af; }
body { background:#e8eee7; }
button,input { font-size:16px; }
button { touch-action:manipulation; }
button:disabled { opacity:.5; cursor:wait; }
button:focus-visible,input:focus-visible,.menu-ball:focus-visible { outline:3px solid #de6c34; outline-offset:3px; }
[hidden] { display:none!important; }
#app-container { width:100%; height:100dvh; border:0; border-radius:0; box-shadow:none; }
#login-page { overflow-y:auto; padding:24px; justify-content:safe center; background:#fcfaf4; }
.login-box { width:100%; max-width:380px; gap:12px; padding:8px 0; }
.hero-image { height:auto; max-height:250px; aspect-ratio:3/2; object-fit:cover; border-radius:20px; }
.event-date { text-align:center; color:#a34421; font-size:15px; letter-spacing:4px; font-weight:800; margin-top:4px; }
.login-title { font-size:27px; letter-spacing:-1px; margin:0 0 6px; }
.camp-info { font-size:14px; gap:5px; margin:0 0 8px; }
.address-row { padding:0 44px 0 0; }
#camp-address { white-space:normal; }
#copy-addr-btn { font-size:12px; padding:6px; }
.hint { font-size:13px; text-align:left; margin:0; }
.login-box input { background:#fff; border:1px solid #b7c4bb; padding:13px; }
#login-btn { background:#234d3e; color:#fff; padding:14px; border-color:#234d3e; }
.text-button { background:none; border:none; font-size:14px; color:#66766d; padding:5px; }
#top-bar { flex:0 0 78px; height:auto; min-height:0; padding:12px 28px; border-bottom:1px solid #c6d2c7; }
.brand { display:flex; align-items:baseline; gap:16px; }
.brand strong { font-size:22px; letter-spacing:-1px; }
.small-date { color:#a34421; font-family:Georgia,serif; font-size:22px; font-style:italic; }
.top-actions { display:flex; align-items:center; gap:10px; }
#user-badge { font-size:14px; color:#5b7062; }
.top-actions button { border:1px solid #b9c9bd; font-size:14px; padding:9px 12px; }
.workspace { flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px,36%) 1fr; }

.panel-heading { padding:24px 24px 18px; display:flex; align-items:center; justify-content:space-between; }
.eyebrow { font-size:11px; font-weight:800; letter-spacing:1.7px; color:#6d7e71; }
h2 { font-size:22px; letter-spacing:-.6px; margin-top:7px; }
.chat-symbol { font-size:30px; color:#a34421; }
.chat-tabs { display:flex; gap:8px; padding:0 24px 14px; border-bottom:1px solid #e1e7df; }
.chat-tabs button { border:0; font-size:14px; padding:9px 14px; border-radius:30px; color:#617368; background:#f0f3ec; }
.chat-tabs button[aria-selected=true] { color:#fff; background:#234d3e; }
#conversation-title { padding:12px 24px; font-size:13px; color:#607366; background:#fafbf7; border-bottom:1px solid #e6eae3; }
.chat-list { min-height:0; background:#fff; padding:18px; gap:12px; overscroll-behavior:contain; }
.chat-empty { font-size:14px; color:#758176; line-height:1.7; }
.chat-bubble { max-width:90%; align-self:flex-start; padding:10px 13px; border:1px solid #e0e5db; border-radius:3px 16px 16px 16px; font-size:15px; background:#f6f8f0; box-shadow:none; line-height:1.5; white-space:normal; }
.chat-bubble.mine { align-self:flex-end; background:#eaf1dd; border-color:#d4dfc8; border-radius:16px 3px 16px 16px; }
.message-meta { display:flex; align-items:center; gap:8px; color:#62745f; font-size:12px; margin-bottom:5px; }

.message-text { white-space:pre-wrap; overflow-wrap:anywhere; }
.message-photo { display:block; padding:0; border:0; border-radius:10px; margin:7px 0 2px; overflow:hidden; background:none; }
.message-photo img { display:block; width:100%; max-width:240px; max-height:260px; object-fit:cover; }
.message-delete { border:0; background:none; font-size:12px; color:#a34421; padding:0 3px; margin-left:auto; }

.composer textarea { flex:1; width:0; min-height:44px; height:44px; max-height:120px; resize:vertical; font:16px var(--font-main); padding:11px; border:1px solid #c3cfbe; border-radius:10px; background:#fff; }
.composer button { flex-shrink:0; height:44px; padding:0 12px; border:1px solid #c3cfbe; font-size:14px; }

.menu-ball { border:1.5px solid #556149; box-shadow:2px 4px 0 #283d2415; gap:1px; }

.ball-user { color:#475b45; }

.ball-like.liked { color:#ae3d29; background:#fff9; }
.ball-comment-count { margin:0; font-size:10px; }

#throw-btn { flex:0 0 auto; background:#d9ed93; padding:0 22px; border:1px solid #748950; }
#my-menu-btn { flex:0 0 60px; font-size:14px; border:1px solid #c6aa96; background:#f7e5d8; }

.modal-header { border-bottom:1px solid #c8d4c0; }
.modal-header button { padding:7px 10px; border:0; font-size:14px; }
.list-item { display:flex; justify-content:space-between; gap:8px; padding:9px 12px; flex-shrink:0; }
.menu-list-name { display:flex; flex:1; min-width:0; text-align:left; flex-direction:column; border:0; background:none; padding:4px; }
.menu-list-name strong { overflow-wrap:anywhere; }
.menu-list-name small { font-size:12px; color:#718068; margin-top:3px; }
.list-like,.delete-button { font-size:14px; border:1px solid #d3dccb; padding:7px 10px; }
.delete-button { color:#9c3d26; }
#photo-viewer { margin:auto; max-width:95vw; max-height:94dvh; border:0; background:#fcfaf4; padding:12px; border-radius:16px; }
#photo-viewer::backdrop { background:#152419bb; }
#photo-viewer img { display:block; max-width:88vw; max-height:78dvh; object-fit:contain; }
#photo-close { display:block; margin-left:auto; margin-bottom:10px; border:0; }

 .arena-heading h2 { font-size:15px; margin:0; }
 .arena-heading p { font-size:11px; margin:0; }

    function showToast(message, duration = 1600) {
        const toast = document.getElementById('toast');

    // 이전에 이 브라우저에서 로그인한 정보가 있으면 자동으로 입력합니다.
    // 자동 로그인은 하지 않고, 사용자가 '들어가기' 버튼을 눌러야 합니다.
    function restoreSavedLogin() {
        try {
            const savedId = localStorage.getItem(SAVED_LOGIN_ID_KEY);
            const savedPw = localStorage.getItem(SAVED_LOGIN_PW_KEY);

            if (!savedId) return;

            idInput.value = savedId;
            pwInput.value = '';
            localStorage.removeItem(SAVED_LOGIN_PW_KEY);

            // 키보드가 자동으로 열리지 않도록 입력창 대신 버튼에 초점을 둡니다.
            requestAnimationFrame(() => loginBtn.focus({ preventScroll: true }));
        } catch (error) {
            // 사생활 보호 모드 등에서 localStorage 사용이 막혀도 앱은 정상 동작합니다.
            console.warn('저장된 로그인 정보를 불러오지 못했습니다.', error);
        }
    }

    // 로그인 검증에 성공한 경우에만 현재 브라우저에 정보를 저장합니다.
    function saveLogin(id, password) {
        try {
            localStorage.setItem(SAVED_LOGIN_ID_KEY, id);
            localStorage.removeItem(SAVED_LOGIN_PW_KEY);
        } catch (error) {
            console.warn('로그인 정보를 이 브라우저에 저장하지 못했습니다.', error);
        }
    }

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function randomDirection() { const angle = Math.random() * Math.PI * 2; return { x: Math.cos(angle), y: Math.sin(angle) }; }
    function isFiniteVector(v) { return Number.isFinite(v.x) && Number.isFinite(v.y); }

    function initPhysics() {
        engine = Engine.create();
        engine.world.gravity.y = 0;
        engine.world.gravity.x = 0;
        arenaWidth = arenaEl.clientWidth;
        arenaHeight = arenaEl.clientHeight;
        createBoundaries();

        (function renderLoop() {
            if (!engine) return;

            if (!isPaused && !activeSuggestionBallId) {
                Engine.update(engine, 1000 / 60);
                resolveOverlaps();
                regulateAllBodies();
            }

            menus.forEach(m => {
                const el = document.getElementById(m.id);
                if (el && m.body) {
                    el.style.left = (m.body.position.x - m.radius) + 'px';
                    el.style.top = (m.body.position.y - m.radius) + 'px';
                }
            });

            requestAnimationFrame(renderLoop);
        })();
    }

    function createBoundaries() {
        if (engine && boundaries.length) Composite.remove(engine.world, boundaries);
        const wallOptions = { isStatic: true, restitution: 1, friction: 0, frictionStatic: 0, slop: 0 };
        boundaries = [
            Bodies.rectangle(arenaWidth / 2, -25, arenaWidth, 50, wallOptions),
            Bodies.rectangle(arenaWidth / 2, arenaHeight + 25, arenaWidth, 50, wallOptions),
            Bodies.rectangle(-25, arenaHeight / 2, 50, arenaHeight, wallOptions),
            Bodies.rectangle(arenaWidth + 25, arenaHeight / 2, 50, arenaHeight, wallOptions)
        ];
        Composite.add(engine.world, boundaries);
    }

    function regulateAllBodies() {
        const now = Date.now();
        menus.forEach(menu => {
            const body = menu.body;
            if (!body) return;
            let velocity = body.velocity, speed = Vector.magnitude(velocity);
            let dir = (speed < 0.001 || !isFiniteVector(velocity)) ? randomDirection() : Vector.normalise(velocity);
            let desiredSpeed = NORMAL_SPEED;
            if (menu.launchStart) {
                const elapsed = now - menu.launchStart;
                if (elapsed < LAUNCH_DURATION) desiredSpeed = LAUNCH_SPEED + (NORMAL_SPEED - LAUNCH_SPEED) * (elapsed / LAUNCH_DURATION);
                else { desiredSpeed = NORMAL_SPEED; menu.launchStart = null; }
            }
            Body.setVelocity(body, { x: dir.x * (speed + (desiredSpeed - speed) * (menu.launchStart ? 0.12 : 0.25)), y: dir.y * (speed + (desiredSpeed - speed) * (menu.launchStart ? 0.12 : 0.25)) });
        });
    }

    function resolveOverlaps() {
        for (let i = 0; i < menus.length; i++) {
            for (let j = i + 1; j < menus.length; j++) {
                const a = menus[i], b = menus[j];
                if (!a.body || !b.body) continue;
                const dx = b.body.position.x - a.body.position.x, dy = b.body.position.y - a.body.position.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                const minDist = a.radius + b.radius + OVERLAP_PADDING;
                if (dist < minDist) {
                    const overlap = (minDist - (dist === 0 ? 0.01 : dist)) / 2, nx = dx / (dist === 0 ? 0.01 : dist), ny = dy / (dist === 0 ? 0.01 : dist);
                    Body.setPosition(a.body, { x: clamp(a.body.position.x - nx * overlap, a.radius, arenaWidth - a.radius), y: clamp(a.body.position.y - ny * overlap, a.radius, arenaHeight - a.radius) });
                    Body.setPosition(b.body, { x: clamp(b.body.position.x + nx * overlap, b.radius, arenaWidth - b.radius), y: clamp(b.body.position.y + ny * overlap, b.radius, arenaHeight - b.radius) });
                    Body.applyForce(a.body, a.body.position, { x: -nx * COLLISION_PUSH, y: -ny * COLLISION_PUSH });
                    Body.applyForce(b.body, b.body.position, { x: nx * COLLISION_PUSH, y: ny * COLLISION_PUSH });
                }
            }
        }
    }

    function recalculateSizes() {
        if (menus.length === 0) return;
        const totalBaseArea = menus.reduce((acc, m) => acc + Math.PI * Math.pow(m.baseRadius, 2), 0);
        const scaleFactor = Math.sqrt(Math.min(1, (arenaWidth * arenaHeight * 0.34) / totalBaseArea));
        menus.forEach(m => {
            const targetRadius = Math.max(40, m.baseRadius * scaleFactor);
            const ratio = targetRadius / m.radius;
            Body.scale(m.body, ratio, ratio);
            m.radius = targetRadius;
            const el = document.getElementById(m.id);
            if (el) { el.style.width = el.style.height = (m.radius * 2) + 'px'; el.style.fontSize = Math.max(12, 14 * scaleFactor) + 'px'; }
        });
    }

    function findSpawnPosition(radius) {
        for (let i = 0; i < 40; i++) {
            const x = clamp((arenaWidth/2) + (Math.random()-0.5)*(18+i*6), radius+6, arenaWidth-radius-6);
            const y = clamp((arenaHeight-radius-14) - i*4, radius+6, arenaHeight-radius-6);
            if (!menus.some(m => Math.hypot(m.body.position.x-x, m.body.position.y-y) < (m.radius+radius+8))) return {x, y};
        }
        return { x: clamp(arenaWidth/2, radius+6, arenaWidth-radius-6), y: arenaHeight-radius-14 };
    }

    function launchBall(m) {
        const angle = (-90 + (Math.random()*24-12)) * Math.PI / 180;
        Body.setVelocity(m.body, { x: Math.cos(angle)*LAUNCH_SPEED, y: Math.sin(angle)*LAUNCH_SPEED });
        m.launchStart = Date.now();
    }

    window.addEventListener('resize', () => {
        if (!engine || !arenaEl.clientWidth || !arenaEl.clientHeight) return;
        arenaWidth = arenaEl.clientWidth;
        arenaHeight = arenaEl.clientHeight;
        createBoundaries();
        recalculateSizes();

        // 화면 크기가 바뀌었을 때 공도 아레나 안으로 다시 넣습니다.
        menus.forEach(m => {
            if (!m.body) return;
            Body.setPosition(m.body, {
                x: clamp(m.body.position.x, m.radius, arenaWidth - m.radius),
                y: clamp(m.body.position.y, m.radius, arenaHeight - m.radius)
            });
        });

        updateListLayout();
    });

    pwInput.addEventListener('input', () => { if (!adminLoginMode) pwInput.value = pwInput.value.replace(/\D/g, '').slice(0, 3); });
    pwInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {

    const eyeSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const eyeOffSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;
    togglePwBtn.addEventListener('click', () => { pwInput.type = pwInput.type === 'password' ? 'text' : 'password'; togglePwBtn.innerHTML = pwInput.type === 'password' ? eyeSvg : eyeOffSvg; });

    loginBtn.addEventListener('click', handleLogin);
    throwBtn.addEventListener('click', throwMenu);
    myMenuBtn.addEventListener('click', toggleMyMenu);
    modalBtn.addEventListener('click', toggleModal);
    modalCloseBtn.addEventListener('click', toggleModal);

    // 페이지가 열리면 저장된 아이디와 비밀번호를 입력란에 복원합니다.

    function escapeHTML(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')

    }

    // 내부 컨텐츠 렌더링을 일관되게 처리하는 헬퍼 함수
    function getBallInnerHTML(m) {

        return `

            <button type="button" class="ball-like ${m.likes?.[currentUser] ? 'liked' : ''}" data-like="${escapeHTML(m.id)}" aria-label="${escapeHTML(m.text)} 좋아요" aria-pressed="${!!m.likes?.[currentUser]}">${m.likes?.[currentUser] ? '♥' : '♡'} <span>${Object.keys(m.likes || {}).length}</span></button>

    // This organizer mode extends the legacy app UI; Firebase Rules remain the security boundary.
    const ADMIN_ID = "캠핑지기";
    const ADMIN_SALT = "57afe525d7f8de80886a2a5f5120e663";
    const ADMIN_VERIFIER = "b3ce3259c8f0b471c690e959ed8d23904e774e1edbdee449056e03c20bc15081";
    async function verifyOrganizer(password) {
        const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(ADMIN_SALT), iterations:210000, hash:'SHA-256'}, key, 256);
        return Array.from(new Uint8Array(bits), n => n.toString(16).padStart(2,'0')).join('') === ADMIN_VERIFIER;
    }
    async function handleLogin() {
        if (loginBtn.disabled) return;
        const idVal = idInput.value.trim(), pwVal = pwInput.value.trim();
        if (!/^[가-힣]{1,16}$/.test(idVal)) return showToast('아이디는 한글 1~16자로 입력해주세요.');
        loginBtn.disabled = true;
        try {
            isAdmin = false;
            if (adminLoginMode) {
                if (idVal !== ADMIN_ID || !await verifyOrganizer(pwVal)) return showToast('관리자 아이디 또는 비밀번호를 확인해주세요.');
                isAdmin = true;
                // Ensure database connectivity before opening the app.
                await get(query(ref(db, 'menus'), limitToLast(1)));
            } else {
                if (idVal === ADMIN_ID) return showToast('관리자 로그인을 이용해주세요.');
                if (!/^\d{3}$/.test(pwVal)) return showToast('비밀번호는 숫자 3자리입니다.');
                const userRef = ref(db, `users/${idVal}`);
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    if (snapshot.val().password !== pwVal) return showToast('비밀번호가 맞지 않아요.');
                } else {
                    const result = await runTransaction(userRef, existing => existing || {password:pwVal});
                    if (result.snapshot.val()?.password !== pwVal) return showToast('사용 중인 이름입니다. 다른 이름을 입력해주세요.');
                }
                saveLogin(idVal, pwVal);
            }
            currentUser = idVal;
            pwInput.value = '';
            document.getElementById('user-badge').textContent = isAdmin ? '관리자' : currentUser;
            myMenuBtn.textContent = isAdmin ? '관리' : '삭제';
            myMenuBtn.setAttribute('aria-label', isAdmin ? '모든 메뉴 삭제 모드' : '내 메뉴 삭제 모드');
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';
            if (!engine) { initPhysics(); initFirebaseListeners(); }
            selectRoom(null);
            showToast(isAdmin ? '관리자 모드로 들어왔어요.' : `${currentUser}님, 반가워요!`);
        } catch (error) { showToast('연결하지 못했어요. 잠시 후 다시 시도해주세요.'); }
        finally { loginBtn.disabled = false; }
    }

    async function throwMenu() {
        const text = menuInput.value.trim();
        if (!text || !currentUser || throwBtn.disabled) return;
        if (text.length > 40) return showToast('메뉴 이름은 40자까지 적어주세요.');
        throwBtn.disabled = true;
        try {
            await push(ref(db, 'menus'), { text, user:currentUser, timestamp:Date.now() });
            menuInput.value = '';
        } catch { showToast('메뉴를 올리지 못했어요. 다시 시도해주세요.'); }
        finally { throwBtn.disabled = false; }
    }

    function initFirebaseListeners() {
        onChildAdded(ref(db, 'menus'), (data) => {
            const val = data.val(), ballId = data.key;
            const radius = 45 + (Math.random() * 8);

            const newMenu = {
                id: ballId,
                user: val.user,
                text: val.text,
                radius: radius,
                baseRadius: radius,
                launchStart: null,
                commentCount: 0,
                comments: [],
                commentsLoaded: false
            };

            const ballEl = document.createElement('div');
            ballEl.id = ballId;
            ballEl.className = 'menu-ball';
            ballEl.tabIndex = 0;
            ballEl.setAttribute('role', 'group');
            ballEl.setAttribute('aria-label', `${val.text}, ${val.user} 추천. Enter로 대화 열기`);
            ballEl.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === ballEl) { e.preventDefault(); handleBallClick(ballId, val.text, val.user); } });
            ballEl.innerHTML = getBallInnerHTML(newMenu);
            ballEl.style.width = ballEl.style.height = (radius * 2) + 'px';
            ballEl.style.backgroundColor = pastelColors[menus.length % pastelColors.length];

            ballEl.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.target.closest('[data-like]')) { toggleLike(ballId); return; }
                handleBallClick(ballId, val.text, val.user);
            });

            arenaEl.appendChild(ballEl);
            const spawn = findSpawnPosition(radius);
            const body = Bodies.circle(spawn.x, spawn.y, radius, { restitution: 1, friction: 0, frictionStatic: 0, frictionAir: 0, density: 0.02, slop: 0 });
            Composite.add(engine.world, body);

            newMenu.body = body;
            menus.push(newMenu);

            recalculateSizes(); resolveOverlaps(); launchBall(newMenu); updateUI();
            if (activeSuggestionBallId) applyChatFocus(activeSuggestionBallId);

            // 실시간 댓글 카운터 + 댓글 내용 리스너
            const commentsRef = ref(db, `menus/${ballId}/comments`);
            newMenu.stopComments = onValue(query(commentsRef, limitToLast(100)), (snapshot) => {
                const m = menus.find(menu => menu.id === ballId);
                if (!m) return;

                m.comments = normalizeMessages(snapshot.val());
                m.commentCount = m.comments.length;
                m.commentsLoaded = true;

                // 삭제 확인 오버레이가 떠 있지 않을 때만 공 내용을 갱신합니다.
                const el = document.getElementById(ballId);
                if (el && !el.querySelector('.delete-overlay')) {
                    el.innerHTML = getBallInnerHTML(m);
                }

                // 이미 열려 있는 댓글창에도 즉시 반영합니다.

            }, () => showToast('메뉴 대화를 불러오지 못했어요.'));
            newMenu.stopLikes = onValue(ref(db, `menus/${ballId}/likes`), snap => {
                newMenu.likes = snap.val() || {};
                const el = document.getElementById(ballId);
                if (el && !el.querySelector('.delete-overlay')) el.innerHTML = getBallInnerHTML(newMenu);
                updateUI();
            }, () => showToast('좋아요를 불러오지 못했어요.'));
        });

        onChildRemoved(ref(db, 'menus'), (data) => {
            const index = menus.findIndex(m => m.id === data.key);
            if (index > -1) {
                if (activeSuggestionBallId === data.key) closeSuggestionMode();
                menus[index].stopComments?.();
                menus[index].stopLikes?.();
                if (roomId === data.key) selectRoom(null);
                Composite.remove(engine.world, menus[index].body);
                document.getElementById(data.key)?.remove();
                menus.splice(index, 1);
                recalculateSizes();
                updateUI();
            }
        });
    }

    function toggleMyMenu() {
        if (activeSuggestionBallId) closeSuggestionMode();
        isPaused = !isPaused;

        myMenuBtn.classList.toggle('active', isPaused);
        clearBallFocusStyles();

        menus.forEach(m => {
            const el = document.getElementById(m.id);
            if (!el) return;

            if (isPaused) {
                if (isAdmin || m.user === currentUser) {
                    el.classList.add('highlight');
                } else {
                    el.classList.add('dimmed', 'interaction-disabled');
                }
            } else {
                el.innerHTML = getBallInnerHTML(m);
            }
        });
    }

    function handleBallClick(ballId, text, user) {
        if (isPaused) {
            // 삭제 모드일 때
            if (!isAdmin && user !== currentUser) return;
            const ballEl = document.getElementById(ballId);
            if (!ballEl || ballEl.querySelector('.delete-overlay')) return;
            menus.forEach(m => {
                const otherEl = document.getElementById(m.id);
                if (otherEl && otherEl.querySelector('.delete-overlay')) otherEl.innerHTML = getBallInnerHTML(m);
            });
            ballEl.innerHTML = `<div class="delete-overlay">x</div>`;
            ballEl.querySelector('.delete-overlay').onclick = async (e) => { e.stopPropagation(); await deleteMenu(ballId); };
        } else {
            // 댓글 모드 활성화
            if (activeSuggestionBallId === ballId) return;
            if (activeSuggestionBallId) closeSuggestionMode();
            openSuggestionMode(ballId);
        }
    }

    document.addEventListener('click', (e) => {
        // 채팅창 바깥 빈공간 클릭 시 닫기
        if (activeSuggestionBallId) {
            const clickedChat = e.target.closest('#community-panel, #modal');
            if (clickedChat) return;
            closeSuggestionMode();
            return;
        }

        // 삭제 모드 취소 로직
        if (!isPaused) return;
        const clickedBall = e.target.closest('.menu-ball');
        const clickedDelete = e.target.closest('.delete-overlay');
        if (clickedDelete) return;
        menus.forEach(m => {
            const el = document.getElementById(m.id);
            if (el && el.querySelector('.delete-overlay')) {
                if (!clickedBall || clickedBall.id !== m.id) {
                    el.innerHTML = getBallInnerHTML(m);
                }
            }
        });
    });

    function openSuggestionMode(ballId) {
        if (!menus.some(m => m.id === ballId)) return;
        activeSuggestionBallId = ballId;
        applyChatFocus(ballId);
        selectRoom(ballId);
        setMobileView('chat');
    }
    function closeSuggestionMode() {
        activeSuggestionBallId = null;
        activeChatWindow = null;
        if (!isPaused) clearBallFocusStyles();
    }
    function updateListLayout() {}
    function updateUI() {
        document.getElementById('menu-count').textContent = menus.length;
        document.getElementById('arena-empty').hidden = menus.length > 0;
        const list = document.getElementById('menu-list');
        list.innerHTML = menus.length ? '' : '<div class="empty-msg">첫 번째 메뉴를 쏘아보세요!</div>';
        [...menus].sort((a,b) => Object.keys(b.likes || {}).length - Object.keys(a.likes || {}).length).forEach(m => {
            const row = document.createElement('div'); row.className = 'list-item';
            const open = document.createElement('button'); open.className = 'menu-list-name';
            open.innerHTML = `<strong>${escapeHTML(m.text)}</strong><small>${escapeHTML(m.user)}</small>`;
            open.onclick = () => { document.getElementById('modal').style.display = 'none'; openSuggestionMode(m.id); };
            const like = document.createElement('button'); like.className = 'list-like';
            like.textContent = `${m.likes?.[currentUser] ? '♥' : '♡'} ${Object.keys(m.likes || {}).length}`;
            like.setAttribute('aria-label', `${m.text} 좋아요`); like.setAttribute('aria-pressed', !!m.likes?.[currentUser]);
            like.onclick = () => toggleLike(m.id);
            row.append(open,like);
            if (isAdmin || m.user === currentUser) {
                const del = document.createElement('button'); del.className = 'delete-button'; del.textContent = '삭제'; del.onclick = () => deleteMenu(m.id); row.append(del);
            }
            list.append(row);
        });
    }

    function toggleModal() {
        const modal = document.getElementById('modal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        if (modal.style.display === 'flex') requestAnimationFrame(updateListLayout);
    }
    function setMobileView(view) {
        document.getElementById('main-page').classList.toggle('show-chat',view==='chat');
        document.getElementById('mobile-menus').setAttribute('aria-pressed',view==='menus');
        document.getElementById('mobile-chat').setAttribute('aria-pressed',view==='chat');
        if(engine) window.dispatchEvent(new Event('resize'));
    }
    document.getElementById('mobile-menus').onclick=()=>{closeSuggestionMode();setMobileView('menus');};
    document.getElementById('mobile-chat').onclick=()=>{closeSuggestionMode();selectRoom(null);setMobileView('chat');};
    const pendingLikes = new Set();
    async function toggleLike(id) {
        if (!currentUser || pendingLikes.has(id)) return;
        const menu = menus.find(m => m.id === id); if (!menu) return;
        pendingLikes.add(id);
        try {
            // Transaction on the menu avoids reviving a concurrently deleted menu.
            await runTransaction(ref(db, `menus/${id}`), value => {
                if (!value) return;
                value.likes = value.likes || {};
                if (value.likes[currentUser]) delete value.likes[currentUser];
                else value.likes[currentUser] = true;
                return value;
            });
        } catch { showToast('좋아요를 저장하지 못했어요.'); }
        finally { pendingLikes.delete(id); }
    }
    async function deleteMenu(id) {
        const menu = menus.find(m => m.id === id);
        if (!menu || (!isAdmin && menu.user !== currentUser)) return;
        if (!confirm(`“${menu.text}” 메뉴와 여기에 달린 대화를 삭제할까요?`)) return;
        try { await remove(ref(db, `menus/${id}`)); showToast('메뉴를 삭제했어요.'); }
        catch { showToast('삭제하지 못했어요. 다시 시도해주세요.'); }
    }
    function validPhoto(value) {
        return typeof value === 'string' && value.length <= 350000 && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value);
    }
    function normalizeMessages(raw) {
        return Object.entries(raw || {}).map(([id,v]) => {
            if (typeof v === 'string' || typeof v === 'number') return {id,text:String(v),user:'',timestamp:0};
            if (!v || typeof v !== 'object') return null;
            return {id,text:String(v.text ?? v.comment ?? v.message ?? ''),user:String(v.user || ''),timestamp:Number(v.timestamp)||0,image:validPhoto(v.image) ? v.image : null};
        }).filter(v => v && (v.text.trim() || v.image)).sort((a,b) => a.timestamp-b.timestamp || a.id.localeCompare(b.id));
    }
    function renderMessages(messages, path) {
        const list = document.getElementById('shared-chat-list');
        const followBottom = list.scrollHeight-list.scrollTop-list.clientHeight < 90;
        const previousTop = list.scrollTop;
        list.replaceChildren();
        if (!messages.length) { const empty=document.createElement('div'); empty.className='chat-empty'; empty.textContent=roomId ? '이 메뉴, 어떻게 먹으면 좋을까요?\n첫 이야기를 남겨보세요.' : '준비물부터 먹고 싶은 음식까지.\n사진과 이야기를 함께 나눠요.'; list.append(empty); }
        messages.forEach(msg => {
            const bubble=document.createElement('div'); bubble.className=`chat-bubble${msg.user === currentUser ? ' mine' : ''}`;
            const meta=document.createElement('div'); meta.className='message-meta';
            const author=document.createElement('strong'); author.textContent=msg.user || '이전 대화'; meta.append(author);
            if(msg.timestamp) { const time=document.createElement('time'); time.textContent=new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(msg.timestamp)); meta.append(time); }
            if(isAdmin || (msg.user && msg.user === currentUser)) { const del=document.createElement('button'); del.className='message-delete'; del.textContent='삭제'; del.setAttribute('aria-label','이 메시지 삭제'); del.onclick=async()=>{if(!confirm('이 메시지를 삭제할까요?'))return;try{await remove(ref(db,`${path}/${msg.id}`));}catch{showToast('메시지를 삭제하지 못했어요.');}};meta.append(del); }
            bubble.append(meta);
            if(msg.text) {const text=document.createElement('div');text.className='message-text';text.textContent=msg.text;bubble.append(text);}
            if(msg.image) { const button=document.createElement('button');button.className='message-photo';button.setAttribute('aria-label','사진 크게 보기');const img=document.createElement('img');img.src=msg.image;img.alt=`${msg.user || '참여자'}님이 올린 사진`;img.loading='lazy';img.onload=()=>{if(followBottom)list.scrollTop=list.scrollHeight;};button.append(img);button.onclick=()=>{const d=document.getElementById('photo-viewer');d.querySelector('img').src=msg.image;d.showModal();};bubble.append(button); }
            list.append(bubble);
        });
        requestAnimationFrame(()=>{list.scrollTop=followBottom ? list.scrollHeight : previousTop;});
    }
    function selectRoom(id) {
        roomUnsubscribe?.(); roomUnsubscribe=null;
        roomId=id; const generation=++roomGeneration;
        const menu=menus.find(m=>m.id===id);
        const path=id ? `menus/${id}/comments` : 'generalChat';
        const menuTab=document.getElementById('menu-tab');menuTab.hidden=!id;menuTab.textContent=menu ? `메뉴 · ${menu.text}` : '메뉴 채팅';
        menuTab.setAttribute('aria-selected',!!id);document.getElementById('general-tab').setAttribute('aria-selected',!id);
        document.getElementById('conversation-title').textContent=menu ? `${menu.user}님 추천 · ${menu.text}` : '다 같이 나누는 캠핑 이야기';
        const list=document.getElementById('shared-chat-list');list.innerHTML='<div class="chat-empty">대화를 불러오는 중…</div>';
        mountComposer(path,id);
        roomUnsubscribe=onValue(query(ref(db,path),limitToLast(100)),snap=>{if(generation===roomGeneration)renderMessages(normalizeMessages(snap.val()),path);},()=>{if(generation===roomGeneration)list.innerHTML='<div class="chat-empty">연결하지 못했어요. 대화방을 다시 선택해주세요.</div>';});
    }
    async function compressPhoto(file) {
        if(file.size>20*1024*1024)throw new Error('사진은 20MB 이하로 선택해주세요.');
        if(!file.type.startsWith('image/'))throw new Error('사진 파일을 선택해주세요.');
        const url=URL.createObjectURL(file);
        try {
            const img=new Image();img.src=url;
            try{await img.decode();}catch{throw new Error('이 사진 형식은 읽을 수 없어요. JPG 또는 PNG로 선택해주세요.');}
            let edge=1000;
            for(let attempt=0;attempt<5;attempt++) {
                const scale=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));
                const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
                const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
                const data=canvas.toDataURL('image/jpeg',.75-attempt*.08);
                if(data.length<=300000)return data;
                edge*=.8;
            }
            throw new Error('사진 용량을 줄이지 못했어요. 다른 사진을 선택해주세요.');
        } finally { URL.revokeObjectURL(url); }
    }
    function mountComposer(path,targetRoom) {
        const host=document.getElementById('shared-composer');host.innerHTML=`<div class="composer"><div class="attachment-preview" hidden></div><div class="composer-row"><input type="file" accept="image/*" hidden><button type="button" class="attach" aria-label="사진 첨부">사진</button><textarea rows="1" maxlength="2000" aria-label="메시지" placeholder="이야기를 남겨주세요"></textarea><button type="button" class="send">전송</button></div><p class="composer-note">사진은 자동으로 압축돼요 · 최근 대화 100개</p></div>`;
        const picker=host.querySelector('input'),text=host.querySelector('textarea'),send=host.querySelector('.send'),attach=host.querySelector('.attach'),preview=host.querySelector('.attachment-preview');
        let imageData=null,uploading=false,preparing=false;
        attach.onclick=()=>picker.click();
        picker.onchange=async()=>{
            const file=picker.files[0];if(!file)return;preparing=true;send.disabled=true;attach.disabled=true;
            try{imageData=await compressPhoto(file);preview.replaceChildren();const img=document.createElement('img');img.src=imageData;img.alt='전송할 사진 미리보기';const cancel=document.createElement('button');cancel.textContent='첨부 취소';cancel.onclick=()=>{imageData=null;preview.hidden=true;picker.value='';};preview.append(img,cancel);preview.hidden=false;}
            catch(e){showToast(e.message);picker.value='';}
            finally{preparing=false;send.disabled=false;attach.disabled=false;}
        };
        async function submit(){
            const content=text.value.trim();if(uploading||preparing||(!content&&!imageData))return;
            if(!currentUser)return;uploading=true;send.disabled=true;attach.disabled=true;text.disabled=true;
            const payload={text:content,user:currentUser,timestamp:Date.now()};if(imageData)payload.image=imageData;
            try{
                if(targetRoom){
                    const messageId=push(ref(db,path)).key;
                    const result=await runTransaction(ref(db,`menus/${targetRoom}`),value=>{if(!value)return;value.comments=value.comments||{};value.comments[messageId]=payload;return value;});
                    if(!result.committed)throw new Error('이 메뉴는 삭제됐어요. 전체 채팅을 이용해주세요.');
                } else {await push(ref(db,path),payload);}
                text.value='';imageData=null;preview.hidden=true;picker.value='';
                const list=document.getElementById('shared-chat-list');list.scrollTop=list.scrollHeight;
            }catch(e){showToast(e.message?.includes('삭제') ? e.message : '전송하지 못했어요. 내용을 확인하고 다시 보내주세요.');}
            finally{uploading=false;send.disabled=false;attach.disabled=false;text.disabled=false;}
        }
        send.onclick=submit;
        text.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(min-width:701px)').matches){e.preventDefault();submit();}};
    }
    document.getElementById('general-tab').onclick=()=>{closeSuggestionMode();selectRoom(null);};
    document.getElementById('menu-tab').onclick=()=>{if(roomId)selectRoom(roomId);};
    document.getElementById('logout-btn').onclick=()=>location.reload();
    document.getElementById('photo-close').onclick=()=>document.getElementById('photo-viewer').close();
    document.getElementById('admin-login-toggle').onclick=()=>{
        adminLoginMode=!adminLoginMode;
        idInput.value=adminLoginMode ? ADMIN_ID : '';idInput.readOnly=adminLoginMode;pwInput.value='';pwInput.inputMode=adminLoginMode ? 'text':'numeric';
        pwInput.placeholder=adminLoginMode ? '관리자 비밀번호':'비밀번호 (숫자 3자리)';
        document.getElementById('admin-login-toggle').textContent=adminLoginMode ? '일반 로그인으로 돌아가기':'관리자 로그인';
        document.querySelector('.hint').textContent=adminLoginMode ? '관리자는 모든 메뉴와 대화를 삭제할 수 있어요.':'처음 온 이름은 자동으로 등록돼요.';
    };
    menuInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();throwMenu();}});
    new ResizeObserver(()=>{if(engine)window.dispatchEvent(new Event('resize'));}).observe(arenaEl);

</script>
